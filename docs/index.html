<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>FlexShare</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root {
        color-scheme: light;
        --page-bg:
          radial-gradient(circle at top, #fde68a 0%, #fff7ed 40%, #fffbeb 100%);
        --card-bg: rgba(255, 255, 255, 0.92);
        --card-line: rgba(245, 158, 11, 0.22);
        --ink: #422006;
        --sub: #92400e;
        --accent: #d97706;
        --accent-strong: #b45309;
        --accent-soft: #fef3c7;
        --preview-bg: #ffffff;
        --shadow: 0 24px 70px rgba(180, 83, 9, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
        color: var(--ink);
        background: var(--page-bg);
      }

      .page {
        width: min(100%, 640px);
        margin: 0 auto;
        padding: 28px 18px 36px;
      }

      .hero {
        margin-bottom: 18px;
      }

      .hero p {
        margin: 0;
        max-width: 32rem;
        font-size: 14px;
        line-height: 1.7;
        color: var(--sub);
      }

      .card {
        background: var(--card-bg);
        backdrop-filter: blur(18px);
        border: 1px solid var(--card-line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .preview {
        padding: 20px;
        background:
          linear-gradient(180deg, rgba(255, 251, 235, 0.9) 0%, rgba(255, 255, 255, 0.8) 100%);
      }

      .bubble {
        border-radius: 28px;
        overflow: hidden;
        background: var(--preview-bg);
        box-shadow: 0 22px 48px rgba(15, 23, 42, 0.14);
      }

      .bubble-header {
        padding: 18px;
        background: linear-gradient(135deg, #f59e0b 0%, #fb7185 100%);
        color: #fff;
      }

      .bubble-header-title {
        font-size: 22px;
        font-weight: 800;
        line-height: 1.2;
      }

      .bubble-header-title.is-placeholder,
      .bubble-header-date.is-placeholder,
      .bubble-title.is-placeholder,
      .bubble-detail.is-placeholder,
      .bubble-action.is-placeholder {
        opacity: 0.34;
      }

      .bubble-header-date {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.82);
      }

      .bubble-body {
        display: grid;
        gap: 14px;
        padding: 20px 18px 18px;
      }

      .bubble-title {
        font-size: 28px;
        font-weight: 800;
        line-height: 1.3;
        color: #111827;
        white-space: pre-wrap;
      }

      .bubble-detail {
        padding: 14px;
        border-radius: 16px;
        background: #fff7ed;
        color: #9a3412;
        font-size: 14px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .bubble-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 16px;
        border-radius: 16px;
        background: #f59e0b;
        color: #ffffff;
        font-size: 14px;
        font-weight: 800;
        text-align: center;
        text-decoration: none;
      }

      .bubble-action.is-disabled {
        background: #cbd5e1 !important;
        color: #64748b;
        pointer-events: none;
      }

      .hidden {
        display: none;
      }

      .grid.hidden,
      .field.hidden,
      .input.hidden,
      .textarea.hidden {
        display: none;
      }

      .panel {
        padding: 18px 18px 22px;
        border-top: 1px solid rgba(245, 158, 11, 0.12);
      }

      .section-block {
        padding: 14px;
        border-radius: 22px;
        border: 1px solid rgba(245, 158, 11, 0.14);
        background: rgba(255, 255, 255, 0.72);
      }

      .section-block + .section-block {
        margin-top: 12px;
      }

      .section-block--header {
        color: #ffffff;
        background: linear-gradient(135deg, #f59e0b 0%, #fb7185 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .section-title {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .section-title--light {
        color: rgba(255, 255, 255, 0.82);
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .section-head .section-title {
        margin: 0;
      }

      .status {
        min-height: 24px;
        margin-bottom: 12px;
        font-size: 13px;
        color: var(--sub);
      }

      .status.error {
        color: #b91c1c;
      }

      .grid {
        display: grid;
        gap: 12px;
      }

      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field--compact {
        min-width: 0;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .field label {
        font-size: 12px;
        font-weight: 800;
        color: var(--sub);
      }

      .field-label-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .field-note {
        font-size: 11px;
        line-height: 1.5;
        color: rgba(146, 64, 14, 0.78);
      }

      .field-count {
        font-size: 11px;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
        color: rgba(146, 64, 14, 0.78);
        white-space: nowrap;
      }

      .section-block--header .field label {
        color: rgba(255, 255, 255, 0.86);
      }

      .section-block--header .field-note {
        color: rgba(255, 255, 255, 0.76);
      }

      .section-block--header .field-count {
        color: rgba(255, 255, 255, 0.76);
      }

      .input,
      .select,
      .textarea {
        width: 100%;
        border: 1px solid rgba(245, 158, 11, 0.3);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.94);
        color: var(--ink);
        padding: 12px 14px;
        font: inherit;
      }

      .textarea {
        min-height: 110px;
        resize: vertical;
      }

      .section-block--header .input,
      .section-block--header .select {
        border-color: rgba(255, 255, 255, 0.24);
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
      }

      .section-block--header .input::placeholder {
        color: rgba(255, 255, 255, 0.68);
      }

      .toggle-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 999px;
        background: #fffaf0;
        border: 1px solid rgba(245, 158, 11, 0.2);
        font-size: 13px;
        color: var(--sub);
        cursor: pointer;
      }

      .toggle--light {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.22);
        color: #ffffff;
      }

      .theme-pills {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .theme-pill {
        position: relative;
        cursor: pointer;
      }

      .theme-pill input {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
      }

      .theme-pill span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.26);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .theme-pill input:checked + span {
        border-color: rgba(255, 255, 255, 0.54);
        box-shadow:
          0 0 0 3px rgba(255, 255, 255, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.24);
      }

      .theme-pill--sunset span {
        background: linear-gradient(135deg, #f59e0b 0%, #fb7185 100%);
      }

      .theme-pill--sky span {
        background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
      }

      .theme-pill--leaf span {
        background: linear-gradient(135deg, #16a34a 0%, #10b981 100%);
      }

      .theme-pill--berry span {
        background: linear-gradient(135deg, #e11d48 0%, #fb7185 100%);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .toggle-panel {
        margin-top: 12px;
      }

      .actions {
        margin-top: 16px;
      }

      .button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 16px 18px;
        background: linear-gradient(135deg, var(--accent) 0%, #ef4444 100%);
        color: #fff;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
      }

      .button[disabled] {
        background: #cbd5e1;
        cursor: not-allowed;
      }

      .note {
        margin-top: 12px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--sub);
      }

      @media (max-width: 560px) {
        .grid.two {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p>
          タイトルと詳細を整えて、そのまま LINE の Flex Message として共有します。
        </p>
      </section>

      <section class="card">
        <div class="preview">
          <div class="bubble">
            <div id="bubbleHeader" class="bubble-header">
              <div id="bubbleHeaderTitle" class="bubble-header-title">
                みんなに共有
              </div>
              <div id="bubbleHeaderDate" class="bubble-header-date"></div>
            </div>
            <div class="bubble-body">
              <div id="bubbleTitle" class="bubble-title">共有タイトル</div>
              <div id="bubbleDetail" class="bubble-detail hidden"></div>
              <a
                id="bubbleAction"
                class="bubble-action hidden"
                href="#"
                target="_blank"
                rel="noreferrer"
              ></a>
            </div>
          </div>
        </div>

        <div class="panel">
          <div id="status" class="status"></div>

          <div class="grid">
            <div id="headerSection" class="section-block section-block--header">
              <div class="section-head">
                <p class="section-title section-title--light">ヘッダー</p>
                <div class="field field--compact">
                  <div class="field-head">
                    <label>カラー</label>
                    <div
                      id="themeSelect"
                      class="theme-pills"
                      role="radiogroup"
                      aria-label="カラー"
                    >
                      <label class="theme-pill theme-pill--sunset">
                        <input type="radio" name="theme" value="sunset" checked>
                        <span aria-hidden="true"></span>
                        <span class="sr-only">サンセット</span>
                      </label>
                      <label class="theme-pill theme-pill--sky">
                        <input type="radio" name="theme" value="sky">
                        <span aria-hidden="true"></span>
                        <span class="sr-only">スカイ</span>
                      </label>
                      <label class="theme-pill theme-pill--leaf">
                        <input type="radio" name="theme" value="leaf">
                        <span aria-hidden="true"></span>
                        <span class="sr-only">リーフ</span>
                      </label>
                      <label class="theme-pill theme-pill--berry">
                        <input type="radio" name="theme" value="berry">
                        <span aria-hidden="true"></span>
                        <span class="sr-only">ベリー</span>
                      </label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="grid">
                <div class="field">
                  <div class="field-label-row">
                    <label for="headerInput">タイトル</label>
                    <div class="field-label-row">
                      <div class="field-note">15文字以内が目安</div>
                      <div id="headerCount" class="field-count">0 / 15</div>
                    </div>
                  </div>
                  <input
                    id="headerInput"
                    class="input"
                    type="text"
                    value="みんなに共有"
                    placeholder="タイトル"
                  >
                </div>

                <div class="field">
                  <div class="field-head">
                    <label for="dateInput">サブタイトル</label>
                    <label class="toggle toggle--light">
                      <input id="showDateToggle" type="checkbox" checked>
                      表示
                    </label>
                  </div>
                  <input
                    id="dateInput"
                    class="input"
                    type="text"
                    placeholder="2026.08.12 共有メモ"
                  >
                </div>
              </div>
            </div>

            <div class="section-block">
              <p class="section-title">本文</p>
              <div class="grid">
                <div class="field">
                  <label for="titleInput">本文タイトル</label>
                  <input
                    id="titleInput"
                    class="input"
                    type="text"
                    placeholder="共有したい内容"
                  >
                </div>

                <div class="field">
                  <div class="field-head">
                    <label for="detailInput">詳細</label>
                    <label class="toggle">
                      <input id="showDetailToggle" type="checkbox" checked>
                      表示
                    </label>
                  </div>
                  <textarea
                    id="detailInput"
                    class="textarea"
                    placeholder="補足やメッセージを入力"
                  ></textarea>
                </div>
              </div>
            </div>

            <div class="section-block">
              <p class="section-title">リンクボタン</p>
              <div class="grid">
                <div class="field">
                  <div class="field-head">
                    <label for="actionUrlInput">URLボタン</label>
                    <label class="toggle">
                      <input id="showActionToggle" type="checkbox">
                      表示
                    </label>
                  </div>
                </div>

                <div id="actionFieldsWrap" class="grid hidden">
                  <div class="field">
                    <label for="actionLabelInput">ボタン文言</label>
                    <input
                      id="actionLabelInput"
                      class="input"
                      type="text"
                      placeholder="詳しく見る"
                    >
                  </div>

                  <div class="field">
                    <label for="actionUrlInput">URL</label>
                    <input
                      id="actionUrlInput"
                      class="input"
                      type="url"
                      placeholder="https://example.com"
                    >
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="shareButton" class="button" type="button">
              LINEでFlexShareする
            </button>
          </div>
        </div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = 'flexshare:lastSentState';
      const DEFAULT_HEADER_TITLE = 'みんなに共有';
      let shouldSuppressActionOnShare = false;
      let shareEnvironmentReady = false;
      let lastBuiltShareMessages = null;

      function getThemePalette(theme) {
        switch (theme) {
          case 'sky':
            return {
              pageBg:
                'radial-gradient(circle at top, #bfdbfe 0%, #eff6ff 40%, #f8fafc 100%)',
              headerBg: 'linear-gradient(135deg, #2563eb 0%, #06b6d4 100%)',
              detailBg: '#eff6ff',
              detailText: '#1d4ed8'
            };
          case 'leaf':
            return {
              pageBg:
                'radial-gradient(circle at top, #bbf7d0 0%, #ecfdf5 40%, #f7fee7 100%)',
              headerBg: 'linear-gradient(135deg, #16a34a 0%, #10b981 100%)',
              detailBg: '#ecfdf5',
              detailText: '#047857'
            };
          case 'berry':
            return {
              pageBg:
                'radial-gradient(circle at top, #fecdd3 0%, #fff1f2 40%, #fdf2f8 100%)',
              headerBg: 'linear-gradient(135deg, #e11d48 0%, #fb7185 100%)',
              detailBg: '#fff1f2',
              detailText: '#be123c'
            };
          case 'sunset':
          default:
            return {
              pageBg:
                'radial-gradient(circle at top, #fde68a 0%, #fff7ed 40%, #fffbeb 100%)',
              headerBg: 'linear-gradient(135deg, #f59e0b 0%, #fb7185 100%)',
              detailBg: '#fff7ed',
              detailText: '#9a3412'
            };
        }
      }

      async function loadPublicConfig() {
        if (window.location.protocol === 'file:') {
          return {
            lineLiffId: ''
          };
        }

        const response = await fetch('./config.json', { cache: 'no-store' });

        if (!response.ok) {
          throw new Error(`config.json load failed: ${response.status}`);
        }

        return response.json();
      }

      function getLiffId(config) {
        return String(config?.lineLiffId || '').trim();
      }

      function getQueryState() {
        const params = new URLSearchParams(window.location.search);

        return {
          hasIncomingActionParam:
            params.has('actionUrl') || params.has('url') || params.has('buttonLabel'),
          theme: String(params.get('theme') || 'sunset').trim(),
          headerTitle: String(params.get('headerTitle') || 'みんなに共有').trim(),
          date: String(params.get('date') || '').trim(),
          title: String(params.get('title') || '').trim(),
          detail: String(params.get('detail') || params.get('content') || '').trim(),
          actionLabel: String(
            params.get('actionLabel') || params.get('buttonLabel') || ''
          ).trim(),
          actionUrl: String(
            params.get('actionUrl') || params.get('url') || ''
          ).trim(),
          showAction: !['0', 'false', 'off'].includes(
            String(params.get('showAction') || 'false').trim().toLowerCase()
          ),
          showDate: !['0', 'false', 'off'].includes(
            String(params.get('showDate') || 'true').trim().toLowerCase()
          ),
          showDetail: !['0', 'false', 'off'].includes(
            String(params.get('showDetail') || 'true').trim().toLowerCase()
          )
        };
      }

      function getEditorState() {
        const selectedTheme = document.querySelector('input[name="theme"]:checked');
        const headerInput = document.getElementById('headerInput');

        return {
          theme: selectedTheme ? selectedTheme.value : 'sunset',
          headerTitle: headerInput.value.trim(),
          headerTitleEdited: headerInput.dataset.edited === '1',
          date: document.getElementById('dateInput').value.trim(),
          title: document.getElementById('titleInput').value.trim(),
          detail: document.getElementById('detailInput').value.trim(),
          actionLabel: document.getElementById('actionLabelInput').value.trim(),
          actionUrl: document.getElementById('actionUrlInput').value.trim(),
          showAction: document.getElementById('showActionToggle').checked,
          showDate: document.getElementById('showDateToggle').checked,
          showDetail: document.getElementById('showDetailToggle').checked
        };
      }

      function applyStateToEditor(state) {
        const nextTheme = state.theme || 'sunset';
        const nextThemeInput = document.querySelector(
          `input[name="theme"][value="${nextTheme}"]`
        );

        if (nextThemeInput) {
          nextThemeInput.checked = true;
        }

        const headerInput = document.getElementById('headerInput');
        headerInput.value = state.headerTitle || DEFAULT_HEADER_TITLE;
        headerInput.dataset.edited = state.headerTitleEdited === true ? '1' : '0';
        document.getElementById('dateInput').value = state.date || '';
        document.getElementById('titleInput').value = state.title || '';
        document.getElementById('detailInput').value = state.detail || '';
        document.getElementById('actionLabelInput').value =
          state.actionLabel || '';
        document.getElementById('actionUrlInput').value = state.actionUrl || '';
        document.getElementById('showActionToggle').checked = state.showAction === true;
        document.getElementById('showDateToggle').checked = state.showDate !== false;
        document.getElementById('showDetailToggle').checked =
          state.showDetail !== false;
        updateFieldCounts();
      }

      function hasQueryOverrides(state) {
        return Boolean(
          state.title
          || state.detail
          || state.date
          || state.actionLabel
          || state.actionUrl
          || state.showAction === true
          || state.headerTitle !== 'みんなに共有'
          || state.theme !== 'sunset'
          || state.showDate !== true
          || state.showDetail !== true
        );
      }

      function hasUrlDrivenContent(state) {
        return Boolean(
          state.title
          || state.detail
          || state.date
          || state.actionLabel
          || state.actionUrl
          || state.hasIncomingActionParam
        );
      }

      function sanitizeUrl(url) {
        const trimmedUrl = String(url || '').trim();

        if (!trimmedUrl) {
          return '';
        }

        try {
          const parsedUrl = new URL(trimmedUrl);

          if (!['https:', 'http:'].includes(parsedUrl.protocol)) {
            return '';
          }

          return parsedUrl.toString();
        } catch (error) {
          return '';
        }
      }

      function getActionLabel(state) {
        return state.actionLabel || '詳しく見る';
      }

      function setPreviewText(element, text, isPlaceholder) {
        element.textContent = text;
        element.classList.toggle('is-placeholder', isPlaceholder);
      }

      function updateFieldCounts() {
        const headerLength = document.getElementById('headerInput').value.length;
        document.getElementById('headerCount').textContent = `${headerLength} / 15`;
      }

      function loadLastSentState() {
        try {
          const rawState = window.localStorage.getItem(STORAGE_KEY);

          if (!rawState) {
            return null;
          }

          const parsedState = JSON.parse(rawState);

          if (!parsedState || typeof parsedState !== 'object') {
            return null;
          }

          return {
            theme: String(parsedState.theme || 'sunset').trim() || 'sunset',
            headerTitle:
              String(parsedState.headerTitle || DEFAULT_HEADER_TITLE).trim()
              || DEFAULT_HEADER_TITLE,
            headerTitleEdited: parsedState.headerTitleEdited === true,
            date: String(parsedState.date || '').trim(),
            title: String(parsedState.title || '').trim(),
            detail: String(parsedState.detail || '').trim(),
            actionLabel: String(parsedState.actionLabel || '').trim(),
            actionUrl: String(parsedState.actionUrl || '').trim(),
            showAction: parsedState.showAction === true,
            showDate: parsedState.showDate !== false,
            showDetail: parsedState.showDetail !== false
          };
        } catch (error) {
          console.error(error);
          return null;
        }
      }

      function persistLastSentState(state) {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              ...state,
              actionUrl: sanitizeUrl(state.actionUrl)
            })
          );
        } catch (error) {
          console.error(error);
        }
      }

      function setStatus(message, isError) {
        const status = document.getElementById('status');
        status.textContent = message || '';
        status.className = isError ? 'status error' : 'status';
      }

      function getValidationMessage(state) {
        if (!state.headerTitle) {
          return 'タイトルを入力してください。';
        }

        if (!state.title) {
          return '本文タイトルを入力してください。';
        }

        if (state.showDate !== false && !state.date) {
          return 'サブタイトルを入力してください。';
        }

        if (state.showDetail !== false && !state.detail) {
          return '詳細を入力してください。';
        }

        if (state.showAction === true) {
          if (!state.actionUrl) {
            return 'URLボタンを表示する場合は URL を入力してください。';
          }

          if (!sanitizeUrl(state.actionUrl)) {
            return 'URL は http または https で入力してください。';
          }
        }

        return '';
      }

      function updateShareButtonState(state) {
        const shareButton = document.getElementById('shareButton');
        const validationMessage = getValidationMessage(state);

        shareButton.disabled = !shareEnvironmentReady || Boolean(validationMessage);

        if (!shareEnvironmentReady) {
          return;
        }

        if (validationMessage) {
          setStatus(validationMessage, true);
          return;
        }

        setStatus('共有ボタンから送り先を選べます。', false);
      }

      function updateFieldVisibility(state) {
        const dateInput = document.getElementById('dateInput');
        const detailInput = document.getElementById('detailInput');
        const actionLabelInput = document.getElementById('actionLabelInput');
        const actionUrlInput = document.getElementById('actionUrlInput');
        const actionFieldsWrap = document.getElementById('actionFieldsWrap');

        dateInput.classList.toggle('hidden', state.showDate === false);
        dateInput.disabled = state.showDate === false;

        detailInput.classList.toggle('hidden', state.showDetail === false);
        detailInput.disabled = state.showDetail === false;

        actionFieldsWrap.classList.toggle('hidden', state.showAction !== true);
        actionLabelInput.disabled = state.showAction !== true;
        actionUrlInput.disabled = state.showAction !== true;
      }

      function renderPreview(state) {
        const palette = getThemePalette(state.theme);
        document.body.style.background = palette.pageBg;
        document.getElementById('bubbleHeader').style.background = palette.headerBg;
        document.getElementById('headerSection').style.background = palette.headerBg;
        const isDefaultHeaderPlaceholder =
          !state.headerTitle
          || (
            state.headerTitle === DEFAULT_HEADER_TITLE
            && state.headerTitleEdited !== true
          );
        setPreviewText(
          document.getElementById('bubbleHeaderTitle'),
          state.headerTitle || DEFAULT_HEADER_TITLE,
          isDefaultHeaderPlaceholder
        );

        const dateNode = document.getElementById('bubbleHeaderDate');
        setPreviewText(dateNode, state.date || 'サブタイトル', !state.date);
        dateNode.classList.toggle('hidden', state.showDate === false);

        setPreviewText(
          document.getElementById('bubbleTitle'),
          state.title || '本文タイトル',
          !state.title
        );

        const detailNode = document.getElementById('bubbleDetail');
        setPreviewText(detailNode, state.detail || '詳細', !state.detail);
        detailNode.style.background = palette.detailBg;
        detailNode.style.color = palette.detailText;
        detailNode.classList.toggle(
          'hidden',
          state.showDetail === false
        );

        const actionNode = document.getElementById('bubbleAction');
        const actionUrl = sanitizeUrl(state.actionUrl);
        const shouldShowAction = state.showAction === true;
        const hasActionUrl = Boolean(actionUrl);
        setPreviewText(actionNode, getActionLabel(state), !state.actionLabel);
        actionNode.href = hasActionUrl ? actionUrl : '#';
        actionNode.style.background = themeStartColor(state.theme);
        actionNode.classList.toggle('hidden', !shouldShowAction);
        actionNode.classList.toggle('is-disabled', !hasActionUrl);
        updateFieldVisibility(state);
        updateShareButtonState(state);
      }

      function buildAltText(state) {
        const title = state.title || state.detail || '共有';
        const headerTitle = state.headerTitle || 'FlexShare';

        return `${headerTitle}: ${title}`;
      }

      function buildShareMessages(state) {
        const palette = getThemePalette(state.theme);
        const bodyContents = [];
        const headerContents = [
          {
            type: 'text',
            text: state.headerTitle || 'みんなに共有',
            color: '#FFFFFF',
            weight: 'bold',
            size: 'lg',
            wrap: true
          }
        ];

        if (state.showDate !== false && state.date) {
          headerContents.push({
            type: 'text',
            text: state.date,
            color: '#FFFFFF',
            size: 'xs',
            margin: 'sm',
            wrap: true
          });
        }

        bodyContents.push({
          type: 'text',
          text: state.title || '共有タイトル',
          size: 'xl',
          weight: 'bold',
          color: '#111827',
          wrap: true
        });

        if (state.showDetail !== false && state.detail) {
          bodyContents.push({
            type: 'box',
            layout: 'vertical',
            paddingAll: '12px',
            backgroundColor: palette.detailBg,
            cornerRadius: '12px',
            contents: [
              {
                type: 'text',
                text: state.detail,
                size: 'sm',
                color: palette.detailText,
                wrap: true
              }
            ]
          });
        }

        const actionUrl = sanitizeUrl(state.actionUrl);

        if (state.showAction === true && actionUrl && !shouldSuppressActionOnShare) {
          bodyContents.push({
            type: 'button',
            style: 'primary',
            color: themeStartColor(state.theme),
            action: {
              type: 'uri',
              label: getActionLabel(state),
              uri: actionUrl
            }
          });
        }

        const messages = [
          {
            type: 'flex',
            altText: buildAltText(state),
            contents: {
              type: 'bubble',
              header: {
                type: 'box',
                layout: 'vertical',
                backgroundColor: themeStartColor(state.theme),
                paddingAll: '16px',
                contents: headerContents
              },
              body: {
                type: 'box',
                layout: 'vertical',
                spacing: 'md',
                contents: bodyContents
              }
            }
          }
        ];

        lastBuiltShareMessages = messages;

        return messages;
      }

      function themeStartColor(theme) {
        switch (theme) {
          case 'sky':
            return '#2563EB';
          case 'leaf':
            return '#16A34A';
          case 'berry':
            return '#E11D48';
          case 'sunset':
          default:
            return '#F59E0B';
        }
      }

      function bindEditorEvents() {
        [
          'headerInput',
          'dateInput',
          'titleInput',
          'detailInput',
          'actionLabelInput',
          'actionUrlInput',
          'showActionToggle',
          'showDateToggle',
          'showDetailToggle'
        ].forEach(id => {
          const element = document.getElementById(id);
          const eventName =
            element.tagName === 'SELECT' || element.type === 'checkbox'
              ? 'change'
              : 'input';

          element.addEventListener(eventName, () => {
            if (id === 'headerInput') {
              element.dataset.edited = '1';
            }
            updateFieldCounts();
            renderPreview(getEditorState());
          });

          if (element.type === 'checkbox') {
            element.addEventListener('input', () => {
              updateFieldCounts();
              renderPreview(getEditorState());
            });

            element.addEventListener('click', () => {
              updateFieldCounts();
              renderPreview(getEditorState());
            });
          }
        });

        document.querySelectorAll('input[name="theme"]').forEach(element => {
          element.addEventListener('change', () => {
            updateFieldCounts();
            renderPreview(getEditorState());
          });
        });
      }

      async function shareFlexMessage() {
        if (!window.liff) {
          setStatus('LIFF SDK を読み込めませんでした。', true);
          return;
        }

        if (!liff.isApiAvailable('shareTargetPicker')) {
          setStatus('LINE アプリ内で開いてください。', true);
          return;
        }

        try {
          setStatus('共有先を開いています…', false);
          const messages = buildShareMessages(getEditorState());
          console.log('FlexShare messages', JSON.stringify(messages, null, 2));
          const result = await liff.shareTargetPicker(
            messages,
            { isMultiple: true }
          );

          if (result) {
            persistLastSentState(getEditorState());
            setStatus('共有しました。', false);

            if (liff.isInClient()) {
              setTimeout(() => liff.closeWindow(), 600);
            }

            return;
          }

          setStatus('共有はキャンセルされました。', false);
        } catch (error) {
          setStatus('共有に失敗しました。時間をおいて再度お試しください。', true);
          console.error('FlexShare last messages', lastBuiltShareMessages);
          console.error(error);
        }
      }

      async function init() {
        const shareButton = document.getElementById('shareButton');
        const queryState = getQueryState();
        shouldSuppressActionOnShare = hasUrlDrivenContent(queryState);
        const initialState = hasQueryOverrides(queryState)
          ? queryState
          : (loadLastSentState() || queryState);

        applyStateToEditor(initialState);
        bindEditorEvents();
        renderPreview(getEditorState());

        let publicConfig;

        try {
          publicConfig = await loadPublicConfig();
        } catch (error) {
          shareButton.disabled = true;
          setStatus(
            'config.json を読み込めませんでした。公開環境で確認してください。',
            true
          );
          console.error(error);
          return;
        }

        const liffId = getLiffId(publicConfig);

        if (window.location.protocol === 'file:') {
          shareEnvironmentReady = false;
          setStatus(
            'ローカルプレビュー中です。共有確認は GitHub Pages など http/https 上で行ってください。',
            false
          );
          updateShareButtonState(getEditorState());
          return;
        }

        if (!liffId) {
          shareEnvironmentReady = false;
          setStatus(
            'config.json の lineLiffId が未設定です。config.example.json を元に設定してください。',
            true
          );
          updateShareButtonState(getEditorState());
          return;
        }

        try {
          await liff.init({ liffId: liffId });
        } catch (error) {
          shareEnvironmentReady = false;
          setStatus('LIFF の初期化に失敗しました。', true);
          console.error(error);
          updateShareButtonState(getEditorState());
          return;
        }

        shareEnvironmentReady = true;
        shareButton.addEventListener('click', shareFlexMessage);
        updateShareButtonState(getEditorState());
      }

      init();
    </script>
  </body>
</html>
